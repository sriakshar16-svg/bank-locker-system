<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal - Bank Locker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-100 via-slate-50 to-indigo-100">
    <div class="bg-white/80 backdrop-blur-xl p-10 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.06)] w-96 border border-white/50 border-t-4 border-t-blue-600">
        <h2 class="text-3xl font-extrabold mb-8 text-center text-slate-800 tracking-tight">Customer Portal</h2>
        
        <script>
            if (window.location.search.includes('error=1')) {
                document.write('<p class="text-red-500 text-sm mb-6 text-center font-bold bg-red-50 py-2 rounded-lg">Invalid Locker Number or Password.</p>');
            }
        </script>
        
        <form action="/client-login" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Locker Number</label>
                <input type="text" name="locker_no" required class="block w-full border border-slate-200 rounded-xl p-3 bg-white/50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all" placeholder="e.g. A-101">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Primary Holder Name</label>
                <input type="password" name="primary_holder" required class="block w-full border border-slate-200 rounded-xl p-3 bg-white/50 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all" placeholder="Case sensitive">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 hover:from-blue-700 hover:to-indigo-700 transition-all duration-300 mt-2">
                Access Dashboard
            </button>
        </form>
        
        <div class="mt-8 text-center border-t border-slate-100 pt-6">
            <a href="/login" class="text-slate-500 font-medium hover:text-slate-800 transition">Branch Manager Login &rarr;</a>
        </div>
    </div>
</body>
</html>
