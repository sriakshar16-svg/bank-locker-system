<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Bank Locker System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96 border-t-4 border-blue-600">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Customer Portal</h2>
        
        <form action="/client-login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Locker Number</label>
                <input type="text" name="locker_no" required class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="e.g. A-101">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Primary Holder Name</label>
                <input type="password" name="primary_holder" required class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="Case sensitive">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 transition shadow">
                Access Dashboard
            </button>
        </form>
        <div class="mt-6 text-center">
            <a href="/login" class="text-xs text-gray-500 hover:underline">Admin Login</a>
        </div>
    </div>
</body>
</html>
