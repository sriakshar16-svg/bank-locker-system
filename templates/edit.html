<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Locker {{ locker.locker_no }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-50 via-slate-50 to-indigo-50 p-8 flex items-center justify-center">
    
    <div class="bg-white/80 backdrop-blur-xl p-10 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-white/50 w-full max-w-md">
        <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight mb-2">Edit Locker</h1>
        <p class="text-slate-500 mb-8 font-medium">Updating details for <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded ml-1 font-bold">{{ locker.locker_no }}</span></p>

        <form action="/edit/{{ locker.locker_no }}" method="POST" class="space-y-5">
            
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 mb-6">
                <p class="text-sm text-slate-500 font-medium">Primary Holder (Read-only)</p>
                <p class="text-lg font-bold text-slate-800 mt-1">{{ locker.primary_holder }}</p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Joint Holder</label>
                <input type="text" name="joint_holder" value="{{ locker.joint_holder }}" placeholder="(Optional)" class="block w-full border border-slate-200 rounded-xl p-3 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all shadow-sm">
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-slate-600 mb-1">Nominee</label>
                <input type="text" name="nominee" value="{{ locker.nominee }}" placeholder="(Optional)" class="block w-full border border-slate-200 rounded-xl p-3 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all shadow-sm">
            </div>
            
            <div class="flex gap-4 pt-4 border-t border-slate-100 mt-6">
                <a href="/" class="w-1/3 bg-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl text-center hover:bg-slate-300 transition-colors">Cancel</a>
                <button type="submit" class="w-2/3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-xl hover:-translate-y-0.5 hover:from-blue-700 hover:to-indigo-700 transition-all">Save Changes</button>
            </div>
        </form>
    </div>

</body>
</html>
