<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bank Locker System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Branch Login</h2>
        
        <script>
            if (window.location.search.includes('error=1')) {
                document.write('<p class="text-red-500 text-sm mb-4 text-center">Invalid username or password.</p>');
            }
        </script>

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" name="username" required class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="admin">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" required class="mt-1 block w-full border border-gray-300 rounded-md p-2" placeholder="admin123">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700">
                Log In
            </button>
        </form>
        <div class="mt-6 text-center">
            <a href="/client-login" class="text-xs text-gray-500 hover:underline">Customer Portal Login</a>
        </div>
    </div>
</body>
</html>
